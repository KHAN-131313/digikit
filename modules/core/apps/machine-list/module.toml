[module]
id = "core/machine-list"
version = "0.0.1"
name = "Machine list"
category = "core"
role = "app"
type = "framework"
author = "khan"
status = "experimental"
summary = "FUNC + SRC (Digitakt II) or FUNC + SYN (Digitone II) opens a digikit list of the machines instead of the firmware's Machine Selection view: the track's machine is marked, YES sets a machine and the list stays open."
requires = ["core/runtime", "core/ui", "core/machines"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# One C source on <dk/platform/ui.h>, dk_ui_core.h and dkrt.h. core/ui owns the firmware side: its hook on the call that shows the
# stock view calls dk_app_machine_list_open. Facts: docs/findings/131 and 132.
[[object]]
path = "build/machine-list.dko.json"
sources = ["src/list.c"]
place = "cf.expansion"

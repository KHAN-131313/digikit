[module]
id = "khan/md"
version = "0.1.0"
name = "MD"
category = "machines"
type = "machine"
author = "khan"
status = "experimental"
summary = "Machinedrum-style drum machines, starting with EFM-BD: an FM kick with pitch ramp and feedback."
dynamic = true
ports = ["dn2-1.12"]
requires = []
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# The machines are declared by builder calls in init (src/module.c). The ids are what the keys hash; `dsp` is the prefix of
# each machine's DSP symbols in src/dsp/md.s. `[uses.<device>]` is written by `mise run module:check`.
[[machine]]
id = "md"

[[machine]]
id = "xt"
dsp = "mx"

[[machine]]
id = "sd"
dsp = "ms"

[[machine]]
id = "cp"
dsp = "mc"

[[machine]]
id = "rs"
dsp = "mr"

[[machine]]
id = "cb"
dsp = "mb"

[[machine]]
id = "hh"
dsp = "mh"

[[machine]]
id = "cy"
dsp = "my"

[[object]]
path = "build/md-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/md-dsp.dko.json"
sources = ["src/dsp/md.s"]
place = "dsp.l2"

[uses.dt2]
machine_rows = 8
param_rows = 16
page_rows = 0
record_bytes = 0

[uses.dn2]
machine_rows = 8
param_rows = 62
page_rows = 8
record_bytes = 6608
dsp_cost_voice = 2880
